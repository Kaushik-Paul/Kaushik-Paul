<svg xmlns="http://www.w3.org/2000/svg" width="354" height="356" viewBox="0 0 354 356" role="img" aria-label="Impact metrics">
  <title>65% faster job creation · 45% better relevancy · 73% faster critical APIs · 1000+ tickets resolved · 30x faster rollouts · 260+ person-hours saved per month</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1a1b2e" />
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .num { font-size: 32px; font-weight: 800; }
    .label { font-size: 13px; font-weight: 600; fill: #c0caf5; }
    .sub { font-size: 10px; fill: #737aa2; }
    .t { animation: fade 0.8s ease-out both; }
    @keyframes fade { from { opacity: 0; } }
  </style>
  <g class="t" style="animation-delay:0.0s">
    <rect x="1" y="1" width="170" height="110" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="18" y="1" width="77" height="3" rx="1.5" fill="#7aa2f7" fill-opacity="0.8" />
    <text x="18" y="50" class="num" fill="#7aa2f7">65%</text>
    <text x="18" y="76" class="label">faster job creation</text>
    <text x="18" y="95" class="sub">AI job creation beta</text>
  </g>
  <g class="t" style="animation-delay:0.1s">
    <rect x="183" y="1" width="170" height="110" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="200" y="1" width="77" height="3" rx="1.5" fill="#bb9af7" fill-opacity="0.8" />
    <text x="200" y="50" class="num" fill="#bb9af7">45%</text>
    <text x="200" y="76" class="label">better relevancy</text>
    <text x="200" y="95" class="sub">job intelligence &amp; matching</text>
  </g>
  <g class="t" style="animation-delay:0.2s">
    <rect x="1" y="123" width="170" height="110" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="18" y="123" width="77" height="3" rx="1.5" fill="#7dcfff" fill-opacity="0.8" />
    <text x="18" y="172" class="num" fill="#7dcfff">73%</text>
    <text x="18" y="198" class="label">faster critical APIs</text>
    <text x="18" y="217" class="sub">performance &amp; reliability</text>
  </g>
  <g class="t" style="animation-delay:0.3s">
    <rect x="183" y="123" width="170" height="110" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="200" y="123" width="77" height="3" rx="1.5" fill="#9ece6a" fill-opacity="0.8" />
    <text x="200" y="172" class="num" fill="#9ece6a">1000+</text>
    <text x="200" y="198" class="label">tickets resolved</text>
    <text x="200" y="217" class="sub">incl. P0 / P1 bugs</text>
  </g>
  <g class="t" style="animation-delay:0.4s">
    <rect x="1" y="245" width="170" height="110" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="18" y="245" width="77" height="3" rx="1.5" fill="#e0af68" fill-opacity="0.8" />
    <text x="18" y="294" class="num" fill="#e0af68">30×</text>
    <text x="18" y="320" class="label">faster rollouts</text>
    <text x="18" y="339" class="sub">dynamic email templating</text>
  </g>
  <g class="t" style="animation-delay:0.5s">
    <rect x="183" y="245" width="170" height="110" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="200" y="245" width="77" height="3" rx="1.5" fill="#f7768e" fill-opacity="0.8" />
    <text x="200" y="294" class="num" fill="#f7768e">260+</text>
    <text x="200" y="320" class="label">hours saved / month</text>
    <text x="200" y="339" class="sub">automation at Relevel</text>
  </g>
</svg>
