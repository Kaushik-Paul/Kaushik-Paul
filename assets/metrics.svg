<svg xmlns="http://www.w3.org/2000/svg" width="832" height="246" viewBox="0 0 832 246" role="img" aria-label="Impact metrics">
  <title>65% faster job creation · 45% better candidate relevancy · 73% faster critical APIs · 1000+ tickets resolved · 60%+ larger candidate pools · 260+ person-hours saved per month</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1a1b2e" />
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .num { font-size: 40px; font-weight: 800; }
    .label { font-size: 15px; font-weight: 600; fill: #c0caf5; }
    .sub { font-size: 12px; fill: #737aa2; }
    .t { animation: fade 0.8s ease-out both; }
    @keyframes fade { from { opacity: 0; } }
  </style>
  <g class="t" style="animation-delay:0.0s">
    <rect x="1" y="1" width="266" height="114" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="18" y="1" width="121" height="3" rx="1.5" fill="#7aa2f7" fill-opacity="0.8" />
    <text x="18" y="52" class="num" fill="#7aa2f7">65%</text>
    <text x="18" y="79" class="label">faster job creation</text>
    <text x="18" y="99" class="sub">AI job creation, now fully live</text>
  </g>
  <g class="t" style="animation-delay:0.1s">
    <rect x="283" y="1" width="266" height="114" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="300" y="1" width="121" height="3" rx="1.5" fill="#bb9af7" fill-opacity="0.8" />
    <text x="300" y="52" class="num" fill="#bb9af7">45%</text>
    <text x="300" y="79" class="label">better candidate relevancy</text>
    <text x="300" y="99" class="sub">richer job intelligence &amp; matching</text>
  </g>
  <g class="t" style="animation-delay:0.2s">
    <rect x="565" y="1" width="266" height="114" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="582" y="1" width="121" height="3" rx="1.5" fill="#7dcfff" fill-opacity="0.8" />
    <text x="582" y="52" class="num" fill="#7dcfff">73%</text>
    <text x="582" y="79" class="label">faster critical APIs</text>
    <text x="582" y="99" class="sub">performance &amp; reliability work</text>
  </g>
  <g class="t" style="animation-delay:0.3s">
    <rect x="1" y="131" width="266" height="114" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="18" y="131" width="121" height="3" rx="1.5" fill="#9ece6a" fill-opacity="0.8" />
    <text x="18" y="182" class="num" fill="#9ece6a">1000+</text>
    <text x="18" y="209" class="label">tickets resolved</text>
    <text x="18" y="229" class="sub">including P0 / P1 production bugs</text>
  </g>
  <g class="t" style="animation-delay:0.4s">
    <rect x="283" y="131" width="266" height="114" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="300" y="131" width="121" height="3" rx="1.5" fill="#e0af68" fill-opacity="0.8" />
    <text x="300" y="182" class="num" fill="#e0af68">60%+</text>
    <text x="300" y="209" class="label">larger candidate pools</text>
    <text x="300" y="229" class="sub">Magic Boost · AI + matching</text>
  </g>
  <g class="t" style="animation-delay:0.5s">
    <rect x="565" y="131" width="266" height="114" rx="14" fill="url(#bg)" stroke="#30363d" />
    <rect x="582" y="131" width="121" height="3" rx="1.5" fill="#f7768e" fill-opacity="0.8" />
    <text x="582" y="182" class="num" fill="#f7768e">260+</text>
