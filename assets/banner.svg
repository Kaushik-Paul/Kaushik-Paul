<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bTitle bDesc">
  <title id="bTitle">Kaushik Paul — SDE-2 @ Instahyre</title>
  <desc id="bDesc">Profile banner: Kaushik Paul, SDE-2 at Instahyre, building backend systems and agentic AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#131a2a" />
      <stop offset="100%" stop-color="#1b1640" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="avatarGradient" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="72%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0d1117" />
    </radialGradient>
    <linearGradient id="rocketGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#5a52d3" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c0caf5" fill-opacity="0.07" />
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="24" /></clipPath>
  </defs>
  <style>
    .blob1 { animation: drift1 14s ease-in-out infinite alternate; }
    .blob2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 40px); } }
    @keyframes drift2 { to { transform: translate(-140px, -30px); } }
    .rocket { animation: float 4s ease-in-out infinite; transform-origin: 170px 160px; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .hello { font-size: 20px; font-weight: 600; letter-spacing: 4px; fill: #7aa2f7; }
    .name { font-size: 68px; font-weight: 800; fill: url(#nameGrad); }
    .role { font-size: 26px; font-weight: 500; fill: #c0caf5; }
    .line { font-size: 22px; fill: #9ece6a; opacity: 0; }
    .l1 { animation: cycle 12s infinite 0s; }
    .l2 { animation: cycle 12s infinite 4s; }
    .l3 { animation: cycle 12s infinite 8s; }
    @keyframes cycle { 0%, 2% { opacity: 0; } 5%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }
    .prompt { font-size: 22px; fill: #565f89; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)" />
    <rect width="1200" height="320" fill="url(#dots)" />
    <circle class="blob1" cx="260" cy="60" r="150" fill="#7aa2f7" fill-opacity="0.22" filter="url(#blur)" />
    <circle class="blob2" cx="1020" cy="270" r="170" fill="#bb9af7" fill-opacity="0.22" filter="url(#blur)" />
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="url(#edge)" stroke-width="2" />

  <!-- avatar -->
  <circle cx="170" cy="160" r="98" fill="none" stroke="#7aa2f7" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8" />
  <circle cx="170" cy="160" r="84" fill="url(#avatarGradient)" stroke="#f0f6fc" stroke-opacity="0.18" stroke-width="2" />
  <g class="rocket">
    <g transform="translate(170 160) scale(0.56) translate(-128 -128)">
      <g transform="translate(10 -10) scale(1.35) rotate(15 88 108)">
        <path d="M88 8c28 22 40 54 40 86 0 32-12 64-40 86-28-22-40-54-40-86 0-32 12-64 40-86z" fill="url(#rocketGradient)" />
        <circle cx="88" cy="68" r="14" fill="#ffffff" opacity="0.9" />
        <circle cx="88" cy="68" r="8" fill="#5a52d3" opacity="0.9" />
        <path d="M48 124c-16 6-28 20-32 36 14-6 30-6 44 0 0-14-4-26-12-36z" fill="#5a52d3" />
        <path d="M128 124c16 6 28 20 32 36-14-6-30-6-44 0 0-14 4-26 12-36z" fill="#5a52d3" />
        <path d="M88 180c0 16-8 28-20 36 2-12-4-22-12-30 10-2 22-4 32-6z" fill="#ffb703" />
      </g>
    </g>
  </g>

  <!-- text -->
  <text x="320" y="96" class="sans hello">HI THERE, I'M</text>
  <text x="316" y="168" class="sans name">Kaushik Paul</text>
  <text x="320" y="214" class="sans role">SDE-2 @ Instahyre  ·  Backend Systems &amp; Agentic AI</text>

  <text x="320" y="262" class="mono prompt">$</text>
  <text x="346" y="262" class="mono line l1">building production-grade AI agents</text>
  <text x="346" y="262" class="mono line l2">scaling backend APIs that stay fast</text>
  <text x="346" y="262" class="mono line l3">shipping high-impact hiring products</text>
</svg>
